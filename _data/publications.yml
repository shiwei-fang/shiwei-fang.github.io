- section: Journal & Conference
  items:

    - title: '" I Like It, But I Don''T Want To Walk Around." A Comparison Between 2D And Augmented Reality Visualizations In Iot Sensing For Privacy Fatigue Reduction'
      authors: Lin Li, Salil Verma, Zi Wang, Shijia Pan, Shiwei Fang
      students: [Salil Verma]
      venue:  ECIS 2026 Proceedings. 15. June, 2026.
      id: ecis_26
      link: https://aisel.aisnet.org/ecis2026/security/security/15/
      abstract: >-
        The prevalence of IoT devices raises privacy concerns due to their privacy-invasive sensors. However, understanding lengthy privacy policies and associated sensor specifications is cognitively demanding, leading to privacy fatigue. This study investigates whether visualization can mitigate this fatigue—based on the Elaboration Likelihood Model (ELM). We also examine whether interactive visualization via Augmented Reality (AR), as a Privacy-Enhancing Technology (PET), is more effective than static visualization in reducing fatigue, drawing on Embodied Cognition Theory (ECT). Using mixed-design ANOVA and pairwise comparisons, we found that visualizing privacy policy and sensor specifications significantly reduced privacy fatigue compared to exposure to privacy policy text. Interestingly, there was no significant difference between 2D and AR visualizations. This research bridges the gap between Information Systems (IS) and IoT sensing studies, contributing to the reduction of privacy fatigue in IoT contexts, both perceptually (user-centric insights) and technically (AR interface design).

    - title: 'Modern Advances in Secure Multi-Party Computation: Protocols, Implementations, and Emerging Applications'
      authors: Salil Verma, Fouda Mostafa, Zubair Md Fadlullah, Shiwei Fang, and Mohamed I. Ibrahem
      students: [Salil Verma]
      venue: In 2026 IEEE 2nd International Conference on Secure IoT, Assured and Trusted Computing (SATC). IEEE, Mar. 2026.
      id: satc_s
      link: https://ieeexplore.ieee.org/abstract/document/11542526
      abstract: >-
        The rapid increase in data exchange among distributed parties has led to privacy concerns during joint computation tasks. The need to ensure privacy in these processes has led to the development and application of cryptographic techniques, including Secure Multi-Party Computation (MPC), Homomorphic Encryption (HE), and Secret Sharing. This paper provides a survey analysis of current trends and developments in cryptographic MPC techniques, with an emphasis on architectures, models, and practical implementations. The paper examines secret sharing approaches to privacy-preserving analytics tasks, MPC inference approaches to large-scale language models, integrated verifiable MPC architectures with blockchain technology, and collaboration approaches among multiple parties in the cloud and edge computing zones. These works form the current state-of-the-art development trend in MPC applications that include cryptographic principles in artificial intelligence applications and distributed computing principles. The paper concludes with research areas that include hybrid MPC-HE models, verifiable computation, and post-quantum secure MPC.


    - title: 'Geospatial Analysis of Wildfire Impact and Predictive Modeling of Susceptibility: A Case Study of Maui, Hawaii and California'
      authors: Jiyue Zhao, Shiwei Fang, Sheng Tan, Sen He, Zi Wang
      venue: Proceedings of the 59th Hawaii International Conference on System Sciences (HICSS). Jan. 2026.
      id: hicss_59
      link: https://doi.org/10.24251/HICSS.2026.189
      abstract: >-
        Catastrophic wildfires pose a growing global threat. This study analyzes their impacts through a comparative analysis, developing a predictive risk model that integrates satellite remote sensing within a cloud-based Geographic Information Systems (GIS) framework. On the Google Earth Engine platform, the differenced Normalized Burn Ratio (dNBR) and Normalized Difference Vegetation Index (NDVI) were applied to assess burn severity and vegetation health for the 2023 Maui wildfire and the early 2025 California wildfire. Despite stronger resilience, California's fires cause a heavier overall economic impact, while Maui's smaller fire delivered a more concentrated, catastrophic blow to its community. The predictive risk model demonstrated high accuracy when validated against historical fire data, successfully identifying low fuel moisture, topography, land cover and human factors as key drivers of susceptibility. This research underscores the need for context-specific management and shows that GIS and cloud-based analysis are powerful tools for enhancing wildfire resilience, response, and planning.


    - title: 'EfficientMic: Adaptive Acoustic Sensing with a Single Microphone for Smart Infrastructure'
      authors: Jack Thomas Adiletta, Matthew Conner Reynolds, Mohammad Nur Hossain Khan, Shiwei Fang, and Bashima Islam
      venue: In Proceedings of the 12th ACM International Conference on Systems for Energy-Efficient Buildings, Cities, and Transportation (BuildSys). ACM, Nov. 2025.
      id: EfficientMic
      link: https://doi.org/10.1145/3736425.3770108
      abstract: >-
        Acoustic sensing is essential in smart infrastructure for occupancy detection, appliance
        monitoring, and anomaly alerts, where latency and continuous operation are critical.
        However, fixed high-rate sampling drains power and storage in embedded systems. Prior
        adaptive sampling approaches often rely on narrow-band speech, analog filters,
        multi-microphone arrays, or task-specific heuristics, each increasing hardware
        complexity or reducing generalizability. We present EfficientMic, a digital,
        aliasing-aware framework for adaptive acoustic sensing using only a single microphone.
        Without analog components, EfficientMic detects aliasing from Short-time Fourier
        Transform (STFT) features using a lightweight XGBoost model and dynamically adjusts the
        sampling rate in real time to preserve fidelity across diverse sounds. Deployed on a
        Raspberry Pi and evaluated on two environmental sound classification datasets,
        EfficientMic reduces storage and energy use by over 70% and 50%, respectively, with
        classification accuracy within 1.2% of full-rate baselines. This task-agnostic,
        hardware-independent design enables scalable, low-power sensing for smart environments.

    - title: 'A survey of foundation models for IoT: taxonomy and criteria-based analysis'
      authors: Hui Wei, Dong Yoon Lee, Shubham Rohal, Zhizhang Hu, Ryan Rossi, Shiwei Fang, and Shijia Pan
      venue: CCF Transactions on Pervasive Computing and Interaction (2025). Springer, Nov. 2025.
      id: iotfmsurvey
      link: https://doi.org/10.1007/s42486-025-00208-w
      abstract: >-
        Foundation models have gained growing interest in the IoT domain due to their reduced
        reliance on labeled data and strong generalizability across tasks, which address key
        limitations of traditional machine learning approaches. However, most existing
        foundation model based methods are developed for specific IoT tasks, making it difficult
        to compare approaches across IoT domains and limiting guidance for applying them to new
        tasks. This survey aims to bridge this gap by providing a comprehensive overview of
        current methodologies and organizing them around four shared performance objectives by
        different domains: efficiency, context-awareness, safety, and security & privacy. For
        each objective, we review representative works, summarize commonly-used techniques and
        evaluation metrics. This objective-centric organization enables meaningful cross-domain
        comparisons and offers practical insights for selecting and designing foundation model
        based solutions for new IoT tasks. We conclude with key directions for future research
        to guide both practitioners and researchers in advancing the use of foundation models in
        IoT applications.

    - title: 'End-to-end differentiable multi-view tracking: Architecture and fine-tuning experiments'
      authors: Colin Samplawski, Shiwei Fang, and Benjamin M. Marlin
      venue: In 2025 28th International Conference on Information Fusion (FUSION). IEEE, July 2025.
      id: mtrack
      link: https://doi.org/10.23919/FUSION65864.2025.11124103
      abstract: >-
        In this work, we develop an end-to-end differentiable multi-view visual tracking
        architecture and explore fine-tuning model parameters via gradient-based optimization
        and automatic differentiation. We consider a setting with multiple camera nodes
        distributed in the tracking environment that collaboratively track objects. The
        architecture that we construct includes within-image-plane deep learning-based detection
        models, probabilistic camera models, object dynamics models, and an N-object Kalman
        filter-based tracking model. We demonstrate fully differentiable choices for each of
        these components, enabling learning and fine-tuning of the parameters of all system
        components based on different forms of supervision. Our results show performance gains
        for N-object tracking when fine-tuning the parameters of the system for end-to-end
        tracking performance.

    - title: Adaptive Dynamic Digital Twin for Test Scenario Generation
      authors: Hanlin Chen, Guanhao Xu, Anye Zhou, Zejiang Wang, Jieqiong Zhao, and Shiwei Fang
      venue: In 2025 IEEE 3rd International Conference on Mobility, Operations, Services and Technologies (MOST). IEEE, May 2025.
      id: digitwin
      link: https://doi.org/10.1109/MOST65065.2025.00024
      abstract: >-
        Vehicle testing has been an important part in the development of both highly automated
        vehicles (HAV) and advanced driving assistant systems (ADAS). Obtaining a good
        representation of the Vehicle Under Test (VUT) is crucial for test scenario library
        generation (TSLG). Current vehicle testing methods often involve calibrating
        car-following models using vehicle trajectory data to create static representations that
        cannot be dynamically updated. For instance, when multiple vehicle trajectories are
        collected, it is difficult to automatically determine whether a new trajectory improves
        the model's representativeness or degrades its accuracy. In this paper, we introduce a
        dynamically updated digital twin modeling framework featuring an adaptive mechanism that
        evaluates new trajectory data. This mechanism can decide whether to incorporate newly
        collected data into the current model or create a separate digital twin model when the
        trajectory significantly differs from prior data. Vehicle location, speed, and
        acceleration extracted from the newly collected trajectory data are used to support the
        dynamic update decision. By integrating this digital twin model into the test library
        generation process, we demonstrate its ability to assist in generating test libraries
        while effectively handling newly collected data.

    - title: 'CACTUS: Dynamically Switchable Context-aware micro-Classifiers for Efficient IoT Inference'
      authors: Mohammad Mehdi Rastikerdar, Jin Huang, Shiwei Fang, Hui Guan, Deepak Ganesan
      venue: In Proceedings of the 22nd Annual International Conference on Mobile Systems, Applications and Services (MobiSys). ACM, June 2024.
      id: CACTUS
      link: https://doi.org/10.1145/3643832.3661888
      abstract: >-
        While existing strategies to execute deep learning-based classification on low-power
        platforms assume the models are trained on all classes of interest, this paper posits
        that adopting context-awareness i.e. narrowing down a classification task to the current
        deployment context consisting of only recent inference queries can substantially enhance
        performance in resource-constrained environments. We propose a new paradigm, CACTUS, for
        scalable and efficient context-aware classification where a micro-classifier recognizes
        a small set of classes relevant to the current context and, when context change happens
        (e.g., a new class comes into the scene), rapidly switches to another suitable
        micro-classifier. CACTUS features several innovations, including optimizing the training
        cost of context-aware classifiers, enabling on-the-fly context-aware switching between
        classifiers, and balancing context switching costs and performance gains via simple yet
        effective switching policies. We show that CACTUS achieves significant benefits in
        accuracy, latency, and compute budget across a range of datasets and IoT platforms.

    - title: 'IoBT-MAX: a Multimodal Analytics eXperimentation Testbed for IoBT Research'
      authors: Benjamin M Marlin, Niranjan Suri, Shiwei Fang, Mani B Srivastava, Colin Samplawski, Ziqi Wang, Maggie Wigness
      venue: Military Communication Conference (MILCOM). IEEE, Oct. 2023.
      id: iobtmax
      link: https://doi.org/10.1109/MILCOM58377.2023.10356347
      abstract: >-
        This paper describes the development and implementation of IoBT-MAX, a multimodal
        analytics experimentation testbed designed to support research and evaluation of
        Internet of Battlefield Things (IoBT) technologies. The testbed consists of a
        distributed set of edge nodes with multimodal sensing and compute capabilities coupled
        with a high-precision GPS localization system, and a remote monitoring and control
        platform. The testbed is designed to support research on multiple analytic tasks
        including object classification, object detection, multi-object tracking, data
        compression, and communication efficient inference and scheduling. The testbed has been
        deployed at the Robotics Research Collaboration Campus (R2C2), a DEVCOM Army Research
        Laboratory (ARL) facility, and is a key research instrumentation project of ARL’s
        Internet of Battlefield Things Collaborative Research Alliance.

    - title: 'CarFi: Rider Localization Using Wi-Fi CSI'
      authors: Sirajum Munir*, Hongkai Chen*, Shiwei Fang*, Mahathir Monjur, Shan Lin, Shahriar Nirjon
      equal_contribution: true
      venue: 2023 IEEE 20th International Conference on Mobile Ad Hoc and Smart Systems (MASS), IEEE, Sept. 2023
      id: carfimass
      link: https://doi.org/10.1109/MASS58611.2023.00072
      abstract: >-
        With the rise of hailing services, people are increasingly relying on shared mobility
        (e.g., Uber, Lyft) drivers to pick up for transportation. However, such drivers and
        riders have difficulties finding each other in urban areas as GPS signals get blocked by
        skyscrapers, in crowded environments (e.g., in stadiums, airports, and bars), at night,
        and in bad weather. It wastes their time, creates a bad user experience, and causes more
        CO2 emissions due to idle driving. In this work, we explore the potential of Wi-Fi to
        help drivers to determine the street side of the riders. Our proposed system is called
        CarFi that uses Wi-Fi CSI from two antennas placed inside a moving vehicle and a
        data-driven technique to determine the street side of the rider. By collecting
        real-world data in realistic and challenging settings by blocking the signal with other
        people and other parked cars, we see that CarFi is 95.44% accurate in rider-side
        determination in both line of sight (LoS) and non-line of sight (nLoS) conditions, and
        can be run on an embedded GPU in real-time.

    - title: Heteroskedastic Geospatial Tracking with Distributed Camera Networks
      authors: Colin Samplawski, Shiwei Fang, Ziqi Wang, Deepak Ganesan, Mani Srivastava, Benjamin M. Marlin
      venue: Proceedings of the 39th Conference on Uncertainty in Artificial Intelligence (UAI 2023). July 2023.
      id: UAI23Abs
      link: https://proceedings.mlr.press/v216/samplawski23a/samplawski23a.pdf
      abstract: >-
        Visual object tracking has seen significant progress in recent years. However, the vast
        majority of this work focuses on tracking objects within the image plane of a single
        camera and ignores the uncertainty associated with predicted object locations. In this
        work, we focus on the geospatial object tracking problem using data from a distributed
        camera network. The goal is to predict an object’s track in geospatial coordinates along
        with uncertainty over the object’s location while respecting communication constraints
        that prohibit centralizing raw image data. We present a novel single-object geospatial
        tracking data set that includes high-accuracy ground truth object locations and video
        data from a network of four cameras. We present a modeling framework for addressing this
        task including a novel backbone model and explore how uncertainty calibration and
        fine-tuning through a differentiable tracker affect performance.

    - title: Optimizing Intelligent Edge-clouds with Partitioning, Compression and Speculative Inference
      authors: Shiwei Fang, Jin Huang, Colin Samplawski, Deepak Ganesan, Benjamin Marlin, Tarek Abdelzaher, and Maggie B. Wigness
      venue: Military Communication Conference (MILCOM). IEEE, Dec. 2021.
      id: MilcomAbs
      link: https://doi.org/10.1109/MILCOM52596.2021.9653126
      abstract: >-
        Internet of Battlefield Things (IoBTs) are well positioned to take advantage of recent
        technology trends that have led to the development of low-power neural accelerators and
        low-cost high-performance sensors. However, a key challenge that needs to be dealt with
        is that despite all the advancements, edge devices remain resource-constrained, thus
        prohibiting complex deep neural networks from deploying and deriving actionable insights
        from various sensors. Furthermore, deploying sophisticated sensors in a distributed
        manner to improve decision-making also poses an extra challenge of coordinating and
        exchanging data between the nodes and server. We propose an architecture that abstracts
        away these thorny deployment considerations from an end-user (such as a commander or
        warfighter). Our architecture can automatically compile and deploy the inference model
        into a set of distributed nodes and server while taking into consideration of the
        resource availability, variation, and uncertainties.

    - title: Exploiting Scene and Body Contexts in Controlling Continuous Vision Body Cameras
      authors: Shiwei Fang, Ketan Mayer-Patel, Shahriar Nirjon
      venue: Ad Hoc Networks Journal, Elsevier, Volume 113, Mar. 2021.
      id: ZenCamJournalAbs
      link: https://doi.org/10.1016/j.adhoc.2020.102373
      abstract: >-
        Ever-increasing performance at decreasing price has fueled camera deployments in a wide
        variety of real-world applications—making the case stronger for battery-powered,
        continuous-vision camera systems. However, given the state-of-the-art battery technology
        and embedded systems, most battery-powered mobile devices still do not support
        continuous vision. In order to reduce energy and storage requirements, there have been
        proposals to offload energy-demanding computations to the cloud Naderiparizi et al.
        (2016), to discard uninteresting video frames Naderiparizi et al. (2017), and to use
        additional sensors to detect and predict when to turn on the camera Bahl et al. (2012) .
        However, these proposals either require a fat communication bandwidth or have to
        sacrifice capturing of important events. <br/> In this paper, we present — ZenCam, which
        is an always-on body camera that exploits readily available information in the encoded
        video stream from the on-chip firmware to classify the dynamics of the scene. This
        scene-context is further combined with simple inertial measurement unit (IMU)-based
        activity level-context of the wearer to optimally control the camera configuration at
        run-time to keep the device under the desired energy budget. We describe the design and
        implementation of ZenCam and thoroughly evaluate its performance in real-world
        scenarios. Our evaluation shows a 29.8%–35% reduction in energy consumption and
        48.1-49.5% reduction in storage usage when compared to a standard baseline setting of
        1920x1080 at 30fps while maintaining a competitive or better video quality at the
        minimal computational overhead.

    - title: 'EyeFi: Fast Human Identification Through Vision and WiFi-based Trajectory Matching'
      authors: Shiwei Fang, Md Tamzeed Islam, Sirajum Munir, Shahriar Nirjon
      venue: International Conference on Distributed Computing in Sensor Systems (DCOSS). IEEE, May 2020.
      id: eyefiAbs
      link: https://doi.org/10.1109/DCOSS49796.2020.00022
      abstract: >-
        Human sensing, motion trajectory estimation, and identification are central to a wide
        range of applications in many domains such as retail stores, surveillance, public
        safety, public address, smart homes and cities, and access control. Existing solutions
        either require facial recognition or installation and maintenance of multiple units, or
        they lack long-term re-identification capability. In this paper, we propose a novel
        system -- called EyeFi -- that combines WiFi and camera on a standalone device to
        overcome these limitations. EyeFi integrates a WiFi chipset to an overhead camera and
        fuses motion trajectories obtained from both vision and RF modalities to identify
        individuals. In order to do that, EyeFi uses a student-teacher model to train a neural
        network to estimate the Angle of Arrival (AoA) of WiFi packets from the CSI values.
        Based on extensive evaluation using real-world data, we observe that EyeFi improves WiFi
        CSI based AoA estimation accuracy by more than 30% and offers 3,800 times computational
        speed over the state-of-the-art solution. In a real-world environment, EyeFi's accuracy
        of person identification averages 75% when the number of people varies from 2 to 10.
      project: /projects/eyefi.html

    - title: 'SuperRF: Enhanced 3D RF Representation Using Stationary Low-Cost mmWave Radar'
      authors: Shiwei Fang, Shahriar Nirjon
      venue: International Conference on Embedded Wireless Systems and Networks (EWSN). ACM, Feb. 2020.
      id: superrfAbs
      link: http://www.ewsn.org/file-repository/ewsn2020/120_131_fang.pdf
      abstract: >-
        This paper introduces SuperRF – which takes radio frequency (RF) signals from an
        off-the-shelf, low-cost, 77GHz mmWave radar and produces an enhanced 3D RF
        representation of a scene. SuperRF is useful in scenarios where camera and other types
        of sensors do not work, or not allowed due to privacy concerns, or their performance is
        impacted due to bad lighting conditions and occlusions, or an alternate RF sensing
        system like synthetic aperture radar (SAR) is too large, inconvenient, and costly.
        Applications of SuperRF includes navigation and planning of autonomous and
        semi-autonomous systems, human-robot interactions and social robotics, and elderly
        and/or patient monitoring in-home healthcare scenarios. We use low-cost, off-the-shelf
        parts to capture RF signals and to train SuperRF. The novelty of SuperRF lies in its use
        of deep learning algorithm, followed by a compressed sensing-based iterative algorithm
        that further enhances the output, to generate a fine-grained 3D representation of an RF
        scene from its sparse RF representation – which a mmWave radar of the same class cannot
        achieve without instrumenting the system with large sized multiple antennas or
        physically moving the antenna over a longer period in time. We demonstrate the
        feasibility and effectiveness through an in-depth evaluation.
      project: /projects/superrf.html

    - title: 'ZenCam: Context-Driven Control of Autonomous Body Cameras'
      authors: Shiwei Fang, Ketan Mayer-Patel, Shahriar Nirjon
      venue: International Conference on Distributed Computing in Sensor Systems (DCOSS). IEEE, May 2019.
      award: Best Paper Award
      id: zencamAbs
      link: https://doi.org/10.1109/DCOSS.2019.00029
      abstract: >-
        In this paper, we present - ZenCam, which is an always-on body camera that exploits
        readily available information in the encoded video stream from the on-chip firmware to
