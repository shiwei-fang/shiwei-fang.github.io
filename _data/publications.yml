    - title: Low Swing TSV Signaling using Novel Level Shifters with Single Supply Voltage
      authors: Shiwei Fang, Emre Salman
      venue: IEEE International Symposium on Circuits and Systems (ISCAS), May 2015.
      id: lowswingAbs
      link: https://doi.org/10.1109/ISCAS.2015.7169059
      abstract: >-
        Low swing TSV signaling is proposed for three-dimensional (3D) integrated circuits (ICs)
        to reduce dynamic power consumption. Novel level shifters are designed to lower the
        voltage swing before the TSV and to pull the voltage swing back to full rail at the far
        end of the TSV. Proposed level shifters operate with a single supply voltage, thereby
        reducing the overall cost. Critical TSV capacitance beyond which the proposed scheme
        saves dynamic power is determined. Up to 42% reduction in overall power is demonstrated
        with a voltage swing of 0.5 V, where the supply voltage is 1 V.


