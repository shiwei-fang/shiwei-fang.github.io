- section: Workshop, Poster, Demo, arXiv
  items:
    - title: 'Dataset: A Novel Aliasing vs Non Aliasing Audio Dataset for Always-On IoT Microphone Experimentation'
      authors: Jack Adiletta, Mohammad Nur Hossain Khan, Matthew Reynolds, Shiwei Fang, and Bashima Islam
      venue: In Proceedings of the 12th ACM International Conference on Systems for Energy-Efficient Buildings, Cities, and Transportation (BuildSys). ACM. Nov. 2025.
      id: micdataset
      link: https://doi.org/10.1145/3736425.3771962
      abstract: >-
        We present the first ever dataset of deliberately aliasing audio. Aliasing, an acoustic
        phenomenon which adds noise and other abnormalities to a recording, occurs when the
        sample rate of audio is below the Nyquist sampling rate. The Nyquist sampling rate is
        defined as 2x the highest frequency present in the audio. Sampling below the Nyquist
        rate folds the upper frequencies into the lower frequencies causing distortion because
        the lower sample rate cannot accurately capture the high frequencies. Using three
        standard audio datasets, we curated several sub-datasets of aliasing audio at different
        sample rates. This dataset is necessary in the age of IoT because always-on microphone
        devices will benefit from lower sample rates which require less power to sample the
        audio and less bandwidth to transmit recordings. Lower sample rates will cause aliasing
        and our dataset is the first dataset pre-made to test the effects of aliasing on
        downstream tasks like audio classification. The dataset can also be used to build
        algorithms to classify audio as aliasing or not.

    - title: Towards Understanding User Privacy Concerns of Internet of Things Sensor Data
      authors: Dipu Ram Roy, Jieqiong Zhao, Shijia Pan, and Shiwei Fang
      students: [Dipu Ram Roy]
      venue: In Proceedings of the 2nd International Workshop on Security and Privacy of Sensing Systems. ACM. May 2025.
      id: pvworkshop
      link: https://doi.org/10.1145/3722566.3727627
      abstract: >-
        Despite the wide adoption of Internet of Things (IoT) devices in people's lives, their
        privacy implications remain unclear to many users. Privacy policies are used as the
        major mechanism to deliver this information, and tools are developed to assist users to
        interpret these policies, there is still a gap between users' perceived privacy and the
        actual privacy risks they face. Especially for various indirect sensing modalities,
        where users' comprehension and concerns about their privacy are unknown. We present
        PrivacyVis, a novel visualization tool that provide an informative and expressive visual
        representation of the sensors, data processing workflows, and associated privacy risks
        of IoT devices. Designed to be user-friendly, the tool aims to enhance users'
        understanding and empower them to make informed decisions about their privacy.
        PrivacyVis allows us to conduct efficient user surveys to understand user concerns and
        perceived privacy for IoT devices.

    - title: 'Poster Abstract: PrivacyVis: Interactive Visualization Tool for Privacy Risks of Internet of Things Sensors'
      authors: Dipu Ram Roy, Jieqiong Zhao, Shijia Pan, and Shiwei Fang
      students: [Dipu Ram Roy]
      venue: In Proceedings of the 23rd ACM Conference on Embedded Networked Sensor Systems (SenSys). ACM. May 2025.
      id: PrivacyVis
      link: https://doi.org/10.1145/3715014.3724041
      abstract: >-
        The widespread adoption of Internet of Things (IoT) devices has significantly enhanced
        convenience for consumers, yet the privacy implications of these devices remain unclear
        to most users, even with the availability of privacy policies. To address this
        challenge, we introduce a novel visualization tool that provides an informative and
        expressive visual representation of the sensors, data processing workflows, and
        associated privacy risks of IoT devices. This user-friendly tool is designed to enhance
        user understanding, empowering them to make informed decisions about their privacy.

    - title: 'Poster: PrivaSee: Augmented Reality-Enabled Privacy Perception Visualization for Internet of Things'
      authors: Yue Zhang, Shangjie Du, Jiqing Wen, Robert Likamwa, Shiwei Fang, Shijia Pan
      venue: In Proceedings of the 22nd Annual International Conference on Mobile Systems, Applications and Services (MobiSys). ACM. June 2024.
      id: PrivaSee
      link: https://doi.org/10.1145/3643832.3661426
      abstract: >-
        Internet of Things (IoT) provides a wide range of services to improve convenience and
        comfort in our daily lives. However, various sensors equipped on IoT devices often raise
        privacy concerns. Prior works on privacy focus on passive protection from the data and
        device perspective, such as data encryption and communication protocol design. In this
        work, we introduce PrivaSee, an augmented reality (AR)-enabled privacy visualization
        platform to empower users with proactive privacy protection by enhancing their
        understanding of privacy perception for multimodal sensors.

    - title: 'GDTM: An Indoor Geospatial Tracking Dataset with Distributed Multimodal Sensors'
      authors: Ho Lyun Jeong, Ziqi Wang, Colin Samplawski, Jason Wu, Shiwei Fang, Lance M. Kaplan, Deepak Ganesan, Benjamin Marlin, Mani Srivastava
      venue: arXiv, Feb. 2024.
      id: GDTM
      link: https://arxiv.org/abs/2402.14136
      abstract: >-
        Constantly locating moving objects, i.e., geospatial tracking, is essential for
        autonomous building infrastructure. Accurate and robust geospatial tracking often
        leverages multimodal sensor fusion algorithms, which require large datasets with
        time-aligned, synchronized data from various sensor types. However, such datasets are
        not readily available. Hence, we propose GDTM, a nine-hour dataset for multimodal object
        tracking with distributed multimodal sensors and reconfigurable sensor node placements.
        Our dataset enables the exploration of several research problems, such as optimizing
        architectures for processing multimodal data, and investigating models' robustness to
        adverse sensing conditions and sensor placement variances. A GitHub repository
        containing the code, sample data, and checkpoints of this work is available at this
        https URL.

    - title: Augmenting Vibration-Based Customer-Product Interaction Recognition with Sparse Load Sensing
      authors: Yue Zhang, Shiwei Fang, Carlos Ruiz, Zhizhang Hu, Shubham Rohal, Shijia Pan
      venue: In Proceedings of Cyber-Physical Systems and Internet of Things Week 2023 (CPS-IoT Week '23). May 2023.
      id: vibproduct
      link: https://doi.org/10.1145/3576914.3589560
      abstract: >-
        This paper introduces a multimodal solution for autonomous retail customer-product
        interaction recognition using a combination of vibration and load sensing. Scalable and
        robust customer-product interaction recognition is important for autonomous retail.
        Current efforts focus on computer vision-based approaches, which are prone to occlusion
        from both customers and shelves. A densely deployed load cell array can mitigate this
        issue, however, the high cost and maintenance effort make it difficult to scale up for
        large deployments. Vibration-based approaches are also explored to detect such
        interaction, however, the robustness over noisy environments is limited. We propose a
        multimodal solution with sparse vibration and load sensing on the shelves. These two
        modalities are complementary in terms of information – load sensing can effectively
        detect the weight changes on the shelf while vibration sensing can recognize detailed
        interaction. Preliminary results are presented to demonstrate the complementarity of
        these two modalities. Our system is able to augment product recognition performance with
        the combination of sparse vibration and load sensing.

    - title: Efficient IoT Inference via Context-Awareness
      authors: Mohammad Mehdi Rastikerdar, Jin Huang, Shiwei Fang, Hui Guan, Deepak Ganesan
      venue: arXiv, Dec. 2023.
      id: iotinfer
      link: https://arxiv.org/abs/2310.19112
      abstract: >-
        While existing strategies to execute deep learning-based classification on low-power
        platforms assume the models are trained on all classes of interest, this paper posits
        that adopting context-awareness i.e. narrowing down a classification task to the current
        deployment context consisting of only recent inference queries can substantially enhance
        performance in resource-constrained environments. We propose a new paradigm, CACTUS, for
        scalable and efficient context-aware classification where a micro-classifier recognizes
        a small set of classes relevant to the current context and, when context change happens
        (e.g., a new class comes into the scene), rapidly switches to another suitable
        micro-classifier. CACTUS features several innovations, including optimizing the training
        cost of context-aware classifiers, enabling on-the-fly context-aware switching between
        classifiers, and balancing context switching costs and performance gains via simple yet
        effective switching policies. We show that CACTUS achieves significant benefits in
        accuracy, latency, and compute budget across a range of datasets and IoT platforms.

    - title: 'CarFi: Rider Localization Using Wi-Fi CSI'
      authors: Sirajum Munir*, Hongkai Chen*, Shiwei Fang*, Mahathir Monjur, Shan Lin, Shahriar Nirjon
      equal_contribution: true
      venue: arXiv, Dec. 2022.
      id: carfi
      link: https://arxiv.org/abs/2301.01592
      abstract: >-
        With the rise of hailing services, people are increasingly relying on shared mobility
        (e.g., Uber, Lyft) drivers to pick up for transportation. However, such drivers and
        riders have difficulties finding each other in urban areas as GPS signals get blocked by
        skyscrapers, in crowded environments (e.g., in stadiums, airports, and bars), at night,
        and in bad weather. It wastes their time, creates a bad user experience, and causes more
        CO2 emissions due to idle driving. In this work, we explore the potential of Wi-Fi to
        help drivers to determine the street side of the riders. Our proposed system is called
        CarFi that uses Wi-Fi CSI from two antennas placed inside a moving vehicle and a
        data-driven technique to determine the street side of the rider. By collecting
        real-world data in realistic and challenging settings by blocking the signal with other
        people and other parked cars, we see that CarFi is 95.44% accurate in rider-side
        determination in both line of sight (LoS) and non-line of sight (nLoS) conditions, and
        can be run on an embedded GPU in real-time.

    - title: Design and Deployment of a Multi-Modal Multi-Node Sensor Data Collection Platform
      authors: Shiwei Fang, Ankur Sarker, Ziqi Wang, Mani Srivastava, Benjamin Marlin, Deepak Ganesan
      venue: 'The Fifth International Workshop on Data: Acquisition To Analysis (DATA ’22) (SenSys + BuildSys). ACM, Nov. 2022.'
      id: mcp
      link: https://doi.org/10.1145/3560905.3567770
      abstract: >-
        Sensing and data collection platforms are the crucial components of high-quality
        datasets that can fuel advancements in research. However, such platforms usually are
        ad-hoc designs and are limited in sensor modalities. In this paper, we discuss our
        experience designing and deploying a multi-modal multi-node sensor data collection
        platform that can be utilized for various data collection tasks. The main goal of this
        platform is to create a modality-rich data collection platform suitable for Internet of
        Things (IoT) applications with easy reproducibility and deployment, which can accelerate
        data collection and downstream research tasks.

    - title: 'Dataset: Person Tracking and Identification using Cameras and Wi-Fi Channel State Information (CSI) from Smartphones'
      authors: Shiwei Fang, Sirajum Munir, Shahriar Nirjon
      venue: 'The 3rd International Workshop on Data: Acquisition To Analysis (DATA ’20) (SenSys + BuildSys). ACM, Nov. 2020.'
      id: eyefidata
      link: https://doi.org/10.1145/3419016.3431488
      abstract: >-
        Human sensing, motion trajectory estimation, and identification are crucial to
        applications such as customer analysis, public safety, smart homes and cities, and
        access control. In the wake of the global COVID-19 pandemic, the ability to perform
        contact tracing effectively is vital to limit the spread of infectious diseases.
        Although vision-based solutions such as facial recognition can potentially scale to
        millions of people for identification, the privacy implications and laws to banning such
        a technology limit its applicability in the real world. Other techniques may require
        installations and maintenance of multiple units, and/or lack long-term re-identification
        capability. We present a dataset to fuse WiFi Channel State Information (CSI) and
        camera-based location information for person identification and tracking. While previous
        works focused on collecting WiFi CSI from stationary transmitters and receivers (laptop,
        desktop, or router), our WiFi CSI data are generated from a smartphone that is carried
        while someone is moving. In addition, we collect camera-generated real-world coordinate
        for each WiFi packet that can serve as ground truth location. The dataset is collected
        in different environments and with various numbers of persons in the scene at several
        days to capture real-world variations.

    - title: 'Demo Abstract: Fusing WiFi and Camera for Fast Motion Tracking and Person Identification'
      authors: Shiwei Fang, Sirajum Munir, Shahriar Nirjon
      venue: ACM Conference on Embedded Networked Sensor Systems (SenSys), Nov. 2020.
      id: eyefidemo
      link: https://doi.org/10.1145/3384419.3430452
      abstract: >-
        Human sensing, motion tracking, and identification are at the center of numerous
        applications such as customer analysis, public safety, smart cities, and surveillance.
        To enable such capabilities, existing solutions mostly rely on vision-based approaches,
        e.g., facial recognition that is perceived to be too privacy invasive. Other
        camera-based approaches using body appearances lack long-term re-identification
        capability. WiFi-based approaches require the installation and maintenance of multiple
        units. We propose a novel system - called EyeFi - that overcomes these limitations on a
        standalone device by fusing camera and WiFi data. We use a three-antenna WiFi chipset to
        measure WiFi Channel State Information (CSI) to estimate the Angle of Arrival (AoA)
        using a neural network trained with a novel student-teacher model. Then, we perform
        cross modal (WiFi, camera) trajectory matching to identify individuals using the MAC
        address of the incoming WiFi packets. We demonstrate our work using real-world data and
        showcase improvements over traditional optimization-based methods in terms of accuracy
        and speed.

    - title: Non-Line-of-Sight Around the Corner Human Presence Detection Using Commodity WiFi Devices
      authors: Shiwei Fang, Ron Alterovitz, Shahriar Nirjon
      venue: Workshop on Device-Free Human Sensing (DFHS). ACM, Nov. 2019.
      id: wifiHumanAbs
      link: https://doi.org/10.1145/3360773.3360879
      abstract: >-
        As robots penetrate into real-world environments, practical human-robot co-existence
        issues such as the requirement for safe human-robot interaction are becoming
        increasingly important. In almost every vision-capable mobile robot, the field of view
        of the robot is occluded by the presence of obstacles such as indoor walls, furniture,
        and humans. Such occlusions force the robots to be stationary or to move slowly so that
        they can avoid collisions and violations of entry into the personal spaces of humans. We
        see this as a barrier to robots being able to optimally plan motions with reasonable
        speeds. In order to solve this problem, we propose to augment the sensing capability of
        a robot by using a commodity WiFi receiver. Using our proposed method, a robot can
        observe the changes in the properties of received signals, and thus be able to infer
        whether a human is present behind the wall or obstacles, which enhances its ability to
        plan and navigate efficiently and intelligently.

    - title: 'Demo Abstract: AI-Enhanced 3D RF Representation Using Low-Cost mmWave Radar'
      authors: Shiwei Fang, Shahriar Nirjon
      venue: ACM Conference on Embedded Networked Sensor Systems (SenSys), Nov. 2018.
      id: ai3dAbs
      link: https://doi.org/10.1145/3274783.3275210
      abstract: >-
        This paper introduces a system that takes radio frequency (RF) signals from an
        off-the-shelf, low-cost, 77 GHz mm Wave radar and produces an enhanced 3D RF
        representation of a scene. Such a system can be used in scenarios where camera and other
        types of sensors do not work, or their performance is impacted due to bad lighting
        conditions and occlusions, or an alternate RF sensing system like synthetic aperture
        radar (SAR) is too large, inconvenient, and costly. The enhanced RF representation can
        be used in numerous applications such as robot navigation, human-computer interaction,
        and patient monitoring. We use off-the-shelf parts to capture RF signals and collect our
        own data set for training and testing of the approach. The novelty of the system lies in
        its use of AI to generate a fine-grained 3D representation of an RF scene from its
        sparse RF representation which a mmWave radar of the same class cannot achieve.

    - title: Distributed Adaptive Model Predictive Control of a Cluster of Autonomous and Context-Sensitive Body Cameras
      authors: Shiwei Fang, Ketan Mayer-Patel, Shahriar Nirjon
      venue: Workshop on Wearable Systems and Applications (WearSys). ACM, June 2017.
      id: distributedAbs
      link: https://doi.org/10.1145/3089351.3089358
      abstract: >-
        Increasing deployment of body cameras by the law enforcement agencies makes us rethink
        the relation between the camera and the public. In contrast to current implementations
        of a body camera that use a power-hungry default configuration and can only be turned on
        and off by an officer, we propose an idea that the camera should be autonomous and
        active all the time. By leveraging the information from an on-board inertial measurement
        unit (IMU), these autonomous cameras should dynamically adjust their configuration in
        order to keep the device under the desired energy budget. To enable such a system, we
        propose a distributed adaptive model predictive controller for a system of body cameras,
        which allows the collaboration between multiple cameras which is currently not available
        in existing implementations.

